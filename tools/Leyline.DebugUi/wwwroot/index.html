<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Leyline — M1.5 debug UI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Leyline debug UI</h1>
    <label>
      Scenario:
      <select id="scenario-select"></select>
    </label>
    <button id="load-button">Load</button>
    <div id="phase-stepper" class="phase-stepper"></div>
    <span id="status-line"></span>
  </header>

  <h2 class="domain-title">Matter domain — the Island</h2>
  <main id="panels">
    <section class="panel" id="panel-p1">
      <h2>P1 view</h2>
      <div class="mana"></div>
      <div class="board-wrap"><svg class="board"></svg></div>
      <div class="selection"></div>
      <div class="hand"></div>
      <div class="actions"></div>
    </section>

    <section class="panel" id="panel-p2">
      <h2>P2 view</h2>
      <div class="mana"></div>
      <div class="board-wrap"><svg class="board"></svg></div>
      <div class="selection"></div>
      <div class="hand"></div>
      <div class="actions"></div>
    </section>

    <section class="panel" id="panel-true">
      <h2>True state</h2>
      <div class="mana"></div>
      <div class="board-wrap"><svg class="board"></svg></div>
      <div class="selection"></div>
      <div class="hand"></div>
      <div class="combat-info"></div>
    </section>
  </main>

  <h2 class="domain-title">Mind domain — Library / Hand / Discard</h2>
  <main id="mind-panels" class="domain-panels">
    <section class="panel domain-subpanel" id="mind-p1">
      <h3>P1 view</h3>
      <div class="zone-block library"></div>
      <div class="zone-block hand"></div>
      <div class="zone-block discard"></div>
    </section>
    <section class="panel domain-subpanel" id="mind-p2">
      <h3>P2 view</h3>
      <div class="zone-block library"></div>
      <div class="zone-block hand"></div>
      <div class="zone-block discard"></div>
    </section>
    <section class="panel domain-subpanel" id="mind-true">
      <h3>True state</h3>
      <div class="zone-block library"></div>
      <div class="zone-block hand"></div>
      <div class="zone-block discard"></div>
    </section>
  </main>

  <h2 class="domain-title">Aether domain — Past / Now / Pending / Future</h2>
  <main id="aether-panels" class="domain-panels">
    <section class="panel domain-subpanel" id="aether-p1">
      <h3>P1 view</h3>
      <div class="zone-block aether-timeline"></div>
    </section>
    <section class="panel domain-subpanel" id="aether-p2">
      <h3>P2 view</h3>
      <div class="zone-block aether-timeline"></div>
    </section>
    <section class="panel domain-subpanel" id="aether-true">
      <h3>True state</h3>
      <div class="zone-block aether-timeline"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
